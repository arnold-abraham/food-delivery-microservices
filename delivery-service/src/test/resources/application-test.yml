spring:
  datasource:
    url: jdbc:h2:mem:deliverydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 500
        request.timeout.ms: 500
        delivery.timeout.ms: 1000
    consumer:
      properties:
        max.block.ms: 500

app:
  kafka:
    enabled: false
    send-timeout-ms: 1
